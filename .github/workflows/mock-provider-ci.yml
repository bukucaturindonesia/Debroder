name: Mock provider isolated verification

on:
  pull_request:
    paths:
      - 'test/fast-checkout-mock-integration.test.ts'
      - 'tests/fixtures/**'
      - 'lib/fast-checkout/**'
      - 'supabase/migrations/20261026045918_fast_checkout_midtrans_rajaongkir_v1.sql'
      - 'supabase/audit/**'
      - 'test/fast-checkout-mock-fetch.test.ts'
      - 'test/fast-checkout-database.test.ts'
      - 'test/fast-checkout-providers.test.ts'
      - '.github/workflows/mock-provider-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock-provider:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      DEBRODER_FAST_CHECKOUT_ENABLED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.12.4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Isolated provider tests (no external provider calls or DB credentials)
        run: pnpm exec vitest run test/fast-checkout-mock-integration.test.ts test/fast-checkout-mock-fetch.test.ts test/fast-checkout-providers.test.ts test/fast-checkout-database.test.ts
      - name: Typecheck
        run: pnpm typecheck
      - name: Full unit and integration regression suite
        run: pnpm test
      - name: Lint
        run: pnpm lint
      - name: Install isolated Chromium for browser mock tests
        run: pnpm exec playwright install --with-deps chromium
      - name: Mock browser checkout (local server, no remote DB)
        env:
          DEBRODER_FAST_CHECKOUT_ENABLED: '1'
          E2E_ALLOW_MUTATIONS: '0'
        run: pnpm exec playwright test e2e/fast-checkout.spec.ts

